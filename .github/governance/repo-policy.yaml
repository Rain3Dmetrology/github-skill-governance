schema_version: 2
policy_status: p1-activation-approved
frozen_at: "2026-08-29"
p1_started_at: "2026-08-29"
negative_test_marker: true

repository:
  owner: Rain3Dmetrology
  name: github-skill-governance
  visibility: public
  profile: public-skill-governance
  default_branch: main

license:
  spdx: Apache-2.0
  source_reuse_policy: independent-rewrite
  clean_room_assurance: policy-established-not-formal-legal-proof
  third_party_notices_required: true
  legacy_repository:
    url: https://github.com/Rain3Dmetrology/github-release-management
    reuse_mode: ideas-and-failure-scenarios-only
    text_or_code_copy_allowed: false

public_api:
  definition:
    - skill names, triggers, and promised behavior
    - script commands, arguments, structured output, and exit codes
    - governance schemas and required fields
    - supported host capabilities and installation contracts
    - README claims marked as implemented

release:
  current_state: disabled-until-p5
  active_version_authority: null
  active_release_authority: null
  planned_version_and_release_authority: release-please
  planned_activation_gate: P5
  accountable_human_maintainer: Rain3Dmetrology
  active_automated_release_owner_count: 0
  release_please_enabled: false
  direct_default_branch_commit: forbidden-after-bootstrap
  local_git_tag: forbidden
  git_push_all_tags: forbidden
  direct_gh_release_create: forbidden
  gh_skill_publish_tag: forbidden
  gh_skill_publish_dry_run: allowed-after-p3
  existing_release_skill_write_access: forbidden

readme:
  primary_locale: en
  files:
    en: README.md
    zh-CN: README.zh-CN.md
  contract: .github/governance/readme-contract.json
  machine_checks:
    - reciprocal-language-links
    - required-section-parity
    - claim-id-parity
    - claim-evidence
    - local-links
  human_checks:
    - semantic-equivalence
    - value-proposition
    - fair-comparison
    - limitations-and-mitigation

permissions:
  R:
    description: read-only analysis with no shared-state changes
    default_decision: allow
    delegation_mode: standing
    requires: []
    examples:
      - inspect repository files and diffs
      - read GitHub checks and logs
      - return audit findings without writing a file
  W:
    description: reversible and reviewable writes
    default_decision: deny
    delegation_mode: task-scoped
    requires:
      - task-scoped user authorization or repository policy
      - complete audit record
    examples:
      - create a draft pull request
      - create an issue
      - write a local patch
  C:
    description: external commitment or permission-sensitive change
    default_decision: deny
    delegation_mode: per-action
    requires:
      - explicit human authorization adjacent to the action
      - deterministic preflight evidence
    examples:
      - create or change the visibility of a public repository
      - merge a pull request
      - create or move a tag
      - publish a release
      - change rulesets, secrets, or permissions
      - deploy to a production environment

credential_and_authority:
  raw_credentials_in_repository: forbidden
  raw_credentials_in_skill: forbidden
  technical_capability_counts_as_delegated_authority: false
  standing_skill_write_authority: false
  standing_skill_commitment_authority: false

automation:
  ai_pr_reviewers_enabled: false
  agentic_workflows_enabled: false
  automated_merge_enabled: false
  automated_release_enabled: false
  automated_ruleset_changes_enabled: false
  automated_secret_changes_enabled: false

platform_enforcement:
  phase: P1
  current_state: ready-for-remote-activation
  issues:
    - 1
    - 2
  required_check: governance-baseline
  codeowners: .github/CODEOWNERS
  policy_schema: .github/governance/repo-policy.schema.json
  actions:
    allowed_external_uses:
      - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    local_actions_allowed: false
    sha_pinning_required: true
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
  rulesets:
    main_desired_state: .github/governance/rulesets/main.json
    all_tag_desired_state: .github/governance/rulesets/freeze-all-tags-until-p5.json
    bypass_actor_count: 0
    required_approving_review_count: 0
    independent_approval_enforced: false
    required_check_integration_id: 15368
  vulnerability_reporting:
    required: true
